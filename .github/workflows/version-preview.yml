name: Prévia de versionamento por sprint

on:
  workflow_call:
    inputs:
      adapter:
        description: Ferramenta de versionamento configurada no consumidor
        required: true
        type: string
      release_branch:
        description: Branch da sprint no formato release/vMAJOR.MINOR.PATCH
        required: true
        type: string
      project_path:
        description: Diretório relativo do projeto/package no consumidor
        required: false
        default: .
        type: string
    outputs:
      bump:
        description: major, minor, patch ou none
        value: ${{ jobs.preview.outputs.bump }}
      candidate_version:
        description: Versão candidata sem tag publicada
        value: ${{ jobs.preview.outputs.candidate_version }}
      summary:
        description: Resumo da análise de commits
        value: ${{ jobs.preview.outputs.summary }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      bump: ${{ steps.preview.outputs.bump }}
      candidate_version: ${{ steps.preview.outputs.candidate_version }}
      summary: ${{ steps.preview.outputs.summary }}
    steps:
      - name: Checkout do repositório consumidor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout da automação na mesma revisão do workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-versioning
          persist-credentials: false
      - name: Preparar Node para projetos npm e Changesets
        if: inputs.adapter == 'standard-version' || inputs.adapter == 'changesets'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar ferramentas Node do consumidor sem scripts de instalação
        if: inputs.adapter == 'standard-version' || inputs.adapter == 'changesets'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: bash .shared-versioning/scripts/versioning/install-node.sh
      - name: Preparar Java para jgitver
        if: inputs.adapter == 'jgitver'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Go para go-gitsemver
        if: inputs.adapter == 'go-gitsemver'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.0'
      - name: Instalar go-gitsemver em revisão fixa
        if: inputs.adapter == 'go-gitsemver'
        run: |
          go install github.com/MyCarrier-DevOps/go-gitsemver@680c1c12d9a4f573a8da1b2e3ccebb3571b1cab6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Calcular prévia somente leitura
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: bash .shared-versioning/scripts/versioning/preview.sh
