name: Pull Request Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Validate pull request title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|chore|ci|build|perf|revert)(\(.+\))?:\ .+ ]]; then
            echo "Use Conventional Commits in the pull request title."
            echo "Example: feat(api): add customer endpoint"
            exit 1
          fi
